name=AAudioLinkFix
version=1.0.0
author=L
maintainer=L
sentence=Linker options for the L ESP32 sketch: wraps ESP-IDF bta_av_co_audio_set_codec (A2DP source crash fix), bta_av_co_get_remote_bitpool_pref (SBC bitpool cap) and, to count media packets, AVDT_WriteReqOpt, L2CA_FlushChannel, bta_av_co_audio_drop.
paragraph=Carries no code. Arduino passes a library's ldflags to the linker only for a precompiled library, so src/esp32 holds an empty stub archive. The wrapper itself is in AAudio.ino.
category=Communication
url=https://github.com/alexlutsenko7/L_8_bit
architectures=esp32
precompiled=true
ldflags=-Wl,--wrap=bta_av_co_audio_set_codec -Wl,--wrap=bta_av_co_get_remote_bitpool_pref -Wl,--wrap=AVDT_WriteReqOpt -Wl,--wrap=L2CA_FlushChannel -Wl,--wrap=bta_av_co_audio_drop
