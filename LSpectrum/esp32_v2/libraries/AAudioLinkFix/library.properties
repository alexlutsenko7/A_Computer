name=AAudioLinkFix
version=1.0.0
author=L
maintainer=L
sentence=Linker option for AAudio: wraps ESP-IDF bta_av_co_audio_set_codec (A2DP source crash fix) and bta_av_co_get_remote_bitpool_pref (SBC bitpool cap).
paragraph=Carries no code. Arduino passes a library's ldflags to the linker only for a precompiled library, so src/esp32 holds an empty stub archive. The wrapper itself is in AAudio.ino.
category=Communication
url=https://github.com/alexlutsenko7/L_8_bit
architectures=esp32
precompiled=true
ldflags=-Wl,--wrap=bta_av_co_audio_set_codec -Wl,--wrap=bta_av_co_get_remote_bitpool_pref
